name: Auto Sync Firebase & Deploy Web

on:
  push:
    branches:
      - master
  schedule:
    # Tự động đồng bộ data lên Firebase & Deploy mỗi 30 phút
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép trigger bằng tay từ tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch Upharma Static Data
        env:
          UPHARMA_USERNAME: ${{ secrets.UPHARMA_USERNAME }}
          UPHARMA_PASSWORD: ${{ secrets.UPHARMA_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_DATABASE_URL: "https://thao-uph-default-rtdb.asia-southeast1.firebasedatabase.app"
          UPHARMA_EXCLUDED_SHOPS: "SHOP0040"
        run: node scripts/fetch-upharma-data.js || true

      - name: Build Angular Project
        run: npm run build -- --configuration production --base-href /thao-upharma/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/thao-upharma/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
