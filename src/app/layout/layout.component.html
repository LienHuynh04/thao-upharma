<div class="upharma-app-layout d-flex flex-row" style="min-height: 100vh; background-color: var(--tblr-bg-main, #f4f6fa);">
  <!-- Left Vertical Sidebar -->
  <app-sidebar
    [isCollapsed]="isSidebarCollapsed"
    (toggleCollapse)="toggleSidebarCollapse()"
    (logoutRequested)="openLogoutConfirm($event)"
    [class.mobile-open]="appClasses['is-sidebar-open']"
  ></app-sidebar>

  <!-- Main Right Container -->
  <div class="main-content-container d-flex flex-column flex-fill" style="min-width: 0; overflow-x: hidden;">
    <!-- Minimal Top Header Bar -->
    <header class="navbar navbar-expand-md navbar-light bg-white border-bottom px-3 py-2 shadow-sm sticky-top" style="min-height: 56px; z-index: 100;">
      <div class="container-fluid d-flex align-items-center justify-content-between p-0">
        <!-- Mobile Toggle & Header Title -->
        <div class="d-flex align-items-center gap-2">
          <button
            class="btn btn-icon btn-ghost-secondary d-md-none border-0"
            type="button"
            (click)="toggleSidebar()"
            aria-label="Toggle navigation"
          >
            <i class="ti ti-menu-2" style="font-size: 1.25rem;"></i>
          </button>

          <!-- Green Vertical Line + Page Title -->
          <div class="d-flex align-items-center gap-2 ms-1">
            <span style="display: inline-block; width: 4px; height: 18px; background-color: #0d472b; border-radius: 2px;"></span>
            <span class="fw-extrabold text-dark fs-4" style="font-weight: 800; color: #111827;">{{ currentPageTitle }}</span>
          </div>
        </div>

        <!-- Top Right User & Status Bar -->
        <div class="d-flex align-items-center gap-3">
          <!-- Status Bullet -->
          <div class="d-flex align-items-center gap-1 text-success fw-bold" style="font-size: 12.5px; color: #10b981 !important;">
            <span style="font-size: 10px;">●</span> Đã đồng bộ
          </div>

          <!-- User Profile Pill Container -->
          <div class="d-flex align-items-center gap-2 px-2 py-1 rounded-pill" style="background-color: #e8f5e9; border: 1px solid #c8e6c9;">
            <div class="avatar avatar-xs text-white fw-bold rounded-circle d-flex align-items-center justify-content-center" style="width: 26px; height: 26px; background-color: #0d472b !important; font-size: 12px;">
              {{ userInitial }}
            </div>
            <div class="d-flex flex-column lh-1 pe-1">
              <span class="fw-extrabold text-dark" style="font-size: 12px; font-weight: 800; color: #111827;">{{ userEmail }}</span>
              <span class="text-secondary" style="font-size: 10px; color: #6b7280; margin-top: 1px;">Đã đăng nhập</span>
            </div>
          </div>

          <!-- Logout Button -->
          <button
            class="btn btn-ghost-danger btn-icon border-0 p-0 ms-1"
            type="button"
            aria-label="Đăng xuất"
            title="Đăng xuất"
            (click)="openLogoutConfirm($event)"
            style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;"
          >
            <i class="ti ti-logout text-danger" style="font-size: 1.2rem;"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Page Content Router Area -->
    <div class="page-wrapper flex-fill p-3 p-md-4" style="overflow-y: auto;">
      <div class="container-fluid page-content-wrapper p-0">
        <router-outlet (activate)="onActivate($event)" (deactivate)="onDeactivate()"></router-outlet>
      </div>
    </div>
  </div>
</div>

<!-- Logout Confirm Modal -->
<div
  class="modal modal-blur fade show"
  *ngIf="showLogoutConfirm"
  style="display: block; background: rgba(0,0,0,0.5); z-index: 1050;"
  (click)="cancelLogout()"
>
  <div class="modal-dialog modal-sm modal-dialog-centered" role="document" (click)="$event.stopPropagation()">
    <div class="modal-content shadow-lg border-0">
      <div class="modal-body text-center py-4">
        <div class="avatar avatar-lg bg-danger-lt text-danger mb-3"><i class="ti ti-logout" style="font-size: 24px;"></i></div>
        <h3>Đăng xuất</h3>
        <div class="text-muted">Bạn có chắc chắn muốn đăng xuất khỏi UPHARMA không?</div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <div class="w-100">
          <div class="row">
            <div class="col">
              <button class="btn btn-link w-100 text-muted text-decoration-none" (click)="cancelLogout()">
                Hủy
              </button>
            </div>
            <div class="col">
              <button class="btn btn-danger w-100" (click)="confirmLogout()">
                Đăng xuất
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Prompt Modal -->
<div
  class="modal modal-blur fade show"
  *ngIf="showPromptModal"
  style="display: block; background: rgba(0,0,0,0.5); z-index: 1050;"
  (click)="closePromptModal()"
>
  <div class="modal-dialog modal-lg modal-dialog-centered" role="document" (click)="$event.stopPropagation()">
    <div class="modal-content shadow-lg border-0">
      <div class="modal-header">
        <h5 class="modal-title">Dữ liệu Prompt</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="closePromptModal()"></button>
      </div>
      <div class="modal-body">
        <textarea class="form-control" rows="15" readonly>{{ promptContent }}</textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-link link-secondary me-auto" (click)="closePromptModal()">Đóng</button>
        <button type="button" class="btn btn-primary" (click)="copyPromptContent()">Copy dữ liệu</button>
      </div>
    </div>
  </div>
</div>
