<main class="login-page">
  <section class="login-card">
    <div class="login-logo-badge">
      <span>U</span>
    </div>

    <h1 class="login-title">NHÀ THUỐC UPHARMA</h1>
    <p class="login-subtitle">Đăng nhập để quản lý dữ liệu</p>

    <form class="login-form" (ngSubmit)="submitLogin()">
      <div class="form-group">
        <label for="username" class="form-label">Email</label>
        <input
          id="username"
          name="username"
          type="text"
          class="form-input"
          [(ngModel)]="username"
          placeholder="Nhập email hoặc tài khoản"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Mật khẩu</label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-input"
          [(ngModel)]="password"
          placeholder="Nhập mật khẩu"
          autocomplete="current-password"
          required
        />
      </div>

      <div class="login-error" *ngIf="errorText" role="alert">
        {{ errorText }}
      </div>

      <button type="submit" class="login-btn" [disabled]="loading">
        <span *ngIf="loading" class="login-spinner"></span>
        <span>{{ loading ? "Đang đăng nhập..." : "Đăng nhập" }}</span>
      </button>
    </form>
  </section>
</main>
